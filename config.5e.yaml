  # ── Homebrew ─────────────────────────────────────────────────────────────
  # LaserLlama's classes, pre-converted to 5etools JSON by the community
  # in TheGiddyLimit/homebrew repo. ttrpg-convert-cli reads homebrew as
  # LOCAL FILES ONLY — it does not fetch URLs, and passing one in will get
  # silently mangled by path normalization (https:// -> https:/) and fail.
  #
  # Setup, run once from your 5eTools working directory (same place you run
  # ttrpg-convert from, e.g. /home/autometalogolex/Documents/5eTools/):
  #   git clone https://github.com/TheGiddyLimit/homebrew.git
  #
  # Paths below are relative to that working directory. Re-run
  # `git -C homebrew pull` occasionally to pick up fixes/new classes upstream.
  homebrew:
    - "homebrew/class/LaserLlama; Alternate Artificer.json"
    - "homebrew/class/LaserLlama; Alternate Barbarian.json"
    - "homebrew/class/LaserLlama; Alternate Bard.json"
    - "homebrew/class/LaserLlama; Alternate Blood Hunter.json"
    - "homebrew/class/LaserLlama; Alternate Cleric.json"
    - "homebrew/class/LaserLlama; Alternate Druid.json"
    - "homebrew/class/LaserLlama; Alternate Fighter.json"
    - "homebrew/class/LaserLlama; Alternate Monk.json"
    - "homebrew/class/LaserLlama; Alternate Paladin.json"
    - "homebrew/class/LaserLlama; Alternate Ranger.json"
    - "homebrew/class/LaserLlama; Alternate Rogue.json"
    - "homebrew/class/LaserLlama; Alternate Sorcerer.json"
    - "homebrew/class/LaserLlama; Alternate Warlock.json"
    - "homebrew/class/LaserLlama; Alternate Wizard.json"

    # Uncomment if you also want the spell list these classes lean on:
    - "homebrew/spell/LaserLlama; LaserLlama's Compendium of Spells.json"
    #   (needed for llspell dependency — see class file `meta` blocks)

    # LaserLlama's original ("full") homebrew classes — not reworks of an
    # official class, brand-new chassis instead. Savant and Shaman ship their
    # "Expanded" variant inside the same file, same pattern as above.
    - "homebrew/class/LaserLlama; Magus.json"
    - "homebrew/class/LaserLlama; Psion.json"
    - "homebrew/class/LaserLlama; Savant.json"
    - "homebrew/class/LaserLlama; Shaman.json"
    - "homebrew/class/LaserLlama; Shifter.json"
    - "homebrew/class/LaserLlama; Vessel.json"
    - "homebrew/class/LaserLlama; Warlord.json"

    # REQUIRED companion file — defines the LL:ME / LL:SE / LL:DE / LL:TE /
    # LL:GS / LL:SS "Exploit" optionalfeaturetypes every Alternate martial
    # class, Warlord, and Magus subclass pulls its exploit lists from.
    # Without this, class/subclass progressions reference feature types
    # that don't exist yet — that's the "Can not find optional feature
    # type LL:XX for progression" wall of errors from the last run.
    - "homebrew/optionalfeature/LaserLlama; Laserllama's Exploit Compendium.json"
    - "homebrew/feat/Laserllama; Compendium of Feats.json"
exclude:
  - "optfeature|bardic warrior|llstyles"
  - "optfeature|blessed warrior|llstyles"
  - "optfeature|eldritch warrior|llstyles"
  - "optfeature|psionic warrior|llstyles"
  - "optfeature|shamanistic warrior|llstyles"
  - "optfeature|sorcerous warrior|llstyles"
